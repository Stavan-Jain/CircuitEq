name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Early warning, NOT a defence: a text search for `debug.*` options in
      # the Lean sources and the Lake configuration. `debug.skipKernelTC`
      # switches the kernel off, and the axiom check below cannot see it (a
      # false `decide +kernel` theorem then depends on no axioms at all). A
      # text search is not sound: an option can be set from meta code under a
      # name no search recognises. The kernel replay below is the defence;
      # this step only names the file and line before a build is paid for.
      - name: Option guard (no debug.* options; early warning only)
        run: python3 scripts/check_debug_options.py
      # The Python that is not Lean: the shared gate alphabet (against the
      # Lean sources and qasm.py's copy), the two agent harnesses (standard library
      # only, no lake, no agent) and the circuit catalogue's fetch/translate
      # and pairing scripts, whose self-tests check every translation rule
      # numerically and so need numpy. pyzx is optional to them; without it
      # the PyZX comparisons are skipped and say so.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python self-tests (harnesses, circuit catalogue)
        run: |
          python3 scripts/alphabet.py --self-test
          python3 scripts/agent_harness.py selftest
          python3 scripts/optimizer_harness.py selftest
          python3 -m pip install --quiet numpy
          python3 scripts/circuit_sources.py --self-test
          python3 scripts/circuit_pairs.py --self-test
      # Fetches the mathlib olean cache and runs `lake build`.
      - uses: leanprover/lean-action@v1
      # Every declaration must depend on exactly [propext, Classical.choice,
      # Quot.sound]: no `native_decide`, no `sorry`, no bespoke axioms. Runs
      # against the build lean-action just produced.
      - name: Axiom policy (standard three axioms only)
        run: lake env lean scripts/AxiomCheck.lean
      # Every declaration of the built `.olean` files of the library and of
      # its examples and tests (`CircuitEqTest`) goes through
      # the kernel again, in a process where no option or meta code of the
      # library runs. This is what catches `debug.skipKernelTC` and any other
      # way of adding a declaration unchecked. `leanchecker` is the former
      # lean4checker, shipped inside the toolchain since v4.28, so it always
      # matches `lean-toolchain`. One thread on purpose: each parallel replay
      # loads a private copy of the mathlib imports (about 2 GB per extra
      # thread; ten threads were killed at 26 GB on a 16 GB machine), while
      # one thread maps them once: 38 s on this runner, 28 s and 0.33 GB on
      # an M4. A step of its own, not lean-action's `leanchecker` input: the
      # thread cap would have to sit on that whole step and would slow the
      # build too. `-v` lists each module replayed, so the log shows what
      # was covered.
      - name: Kernel replay (leanchecker over the CircuitEq oleans)
        env:
          LEAN_NUM_THREADS: "1"
        run: lake env leanchecker -v CircuitEq CircuitEqTest
      # The replay must reject `2 + 2 = 5` sealed behind `debug.skipKernelTC`
      # (`scripts/SkipKernelTCFixture.lean`, not part of any `lean_lib`), the
      # text guard must flag it, and it must still compile clean, so that a
      # toolchain bump cannot silently turn the replay into a no-op.
      - name: Replay regression fixture (2 + 2 = 5 must be rejected)
        run: bash scripts/check_replay_fixture.sh
